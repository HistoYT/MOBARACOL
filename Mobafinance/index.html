<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MobaFinance AI · Entiende el dinero de tu empresa</title>
  <meta name="description" content="MobaFinance AI analiza los ingresos, gastos y la caja de tu empresa, calcula indicadores, proyecta escenarios y te explica con IA qué está pasando con tu dinero. Hecho para pymes colombianas.">
  <meta name="theme-color" content="#0A0B0E">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%231560BD'/%3E%3Cstop offset='.6' stop-color='%231E7FE0'/%3E%3Cstop offset='1' stop-color='%2322C7F0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M8 23V10.5l6 6.5 6-6.5V23M20 10.5l5.5-5.5M21 5h4.5v4.5' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#view">Saltar al contenido</a>

  <div class="app" id="app">
    <!-- ============ BARRA LATERAL ============ -->
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
      <div class="sidebar__brand">
        <a href="#/panel" class="brand" aria-label="MobaFinance AI, ir al panel">
          <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
            <defs><linearGradient id="brandGrad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1560BD"/><stop offset=".6" stop-color="#1E7FE0"/><stop offset="1" stop-color="#22C7F0"/></linearGradient></defs>
            <rect width="32" height="32" rx="9" fill="url(#brandGrad)"/>
            <path d="M8 23V10.5l6 6.5 6-6.5V23M20 10.5l5.5-5.5M21 5h4.5v4.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="brand__name">MobaFinance <em>AI</em></span>
        </a>
        <button class="icon-btn sidebar__collapse" id="collapseBtn" type="button" aria-label="Contraer menú" title="Contraer menú"><span data-icon="chevronLeft"></span></button>
      </div>

      <nav class="nav" aria-label="Secciones">
        <a class="nav__item" href="#/panel" data-route="panel"><span class="nav__icon" data-icon="grid"></span><span class="nav__label">Panel</span></a>
        <div class="nav__group">
          <a class="nav__item" href="#/analisis/resultados" data-route="analisis"><span class="nav__icon" data-icon="chart"></span><span class="nav__label">Análisis</span></a>
          <div class="nav__sub">
            <a href="#/analisis/resultados" data-sub="resultados">Estado de resultados</a>
            <a href="#/analisis/flujo" data-sub="flujo">Flujo de caja</a>
            <a href="#/analisis/cartera" data-sub="cartera">Cartera</a>
            <a href="#/analisis/gastos" data-sub="gastos">Gastos</a>
            <a href="#/analisis/indicadores" data-sub="indicadores">Indicadores</a>
          </div>
        </div>
        <a class="nav__item" href="#/estados/resultados" data-route="estados"><span class="nav__icon" data-icon="book"></span><span class="nav__label">Estados financieros</span></a>
        <a class="nav__item" href="#/asistente" data-route="asistente"><span class="nav__icon" data-icon="sparkles"></span><span class="nav__label">Asistente IA</span></a>
        <a class="nav__item" href="#/simulador" data-route="simulador"><span class="nav__icon" data-icon="sliders"></span><span class="nav__label">Simulador</span></a>
        <a class="nav__item" href="#/valoracion/dcf" data-route="valoracion"><span class="nav__icon" data-icon="calculator"></span><span class="nav__label">Valoración</span><span class="nav__badge">Pro</span></a>
        <a class="nav__item" href="#/datos" data-route="datos"><span class="nav__icon" data-icon="database"></span><span class="nav__label">Datos</span></a>
      </nav>

      <div class="sidebar__foot">
        <a class="nav__item" href="#/ajustes" data-route="ajustes"><span class="nav__icon" data-icon="settings"></span><span class="nav__label">Ajustes</span></a>
        <button class="nav__item" type="button" id="howBtn"><span class="nav__icon" data-icon="help"></span><span class="nav__label">Cómo funciona</span></button>
        <div class="company" id="companyCard">
          <span class="company__avatar" id="companyAvatar">CA</span>
          <span class="company__meta"><strong id="companyName">Mi empresa</strong><small id="companyPlan">Plan Pyme · Prueba</small></span>
        </div>
      </div>
    </aside>

    <!-- ============ CONTENIDO ============ -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn topbar__menu" id="menuBtn" type="button" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false"><span data-icon="menu"></span></button>
        <div class="search" role="search">
          <span class="search__icon" data-icon="search"></span>
          <input id="searchInput" type="search" placeholder="Busca o pregúntale a la IA…" autocomplete="off" aria-label="Buscar o preguntar" aria-controls="searchResults" aria-expanded="false">
          <kbd class="search__kbd">Ctrl K</kbd>
          <div class="search__results" id="searchResults" role="listbox" hidden></div>
        </div>
        <div class="topbar__right">
          <div class="pill pill--period" id="periodPill" title="Período analizado"><span data-icon="calendar"></span><span id="periodText">—</span></div>
          <a class="ai-status" id="aiStatus" href="#/ajustes" title="Proveedor de IA"><i></i><span>Motor local</span></a>
          <div class="bell">
            <button class="icon-btn" id="bellBtn" type="button" aria-label="Alertas" aria-expanded="false" aria-controls="bellPop"><span data-icon="bell"></span><span class="bell__count" id="bellCount" hidden>0</span></button>
            <div class="popover" id="bellPop" hidden></div>
          </div>
          <span class="avatar" id="userAvatar" title="Tu perfil">C</span>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="js/core.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/engine.js" defer></script>
  <script src="js/ai.js" defer></script>
  <script src="js/charts.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/statements.js" defer></script>
  <script src="js/views.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
